# Financial Tracker Configuration

# Data directories
data:
  raw_statements: "./data/raw"
  processed: "./data/processed" 
  categorized: "./data/categorized"

# Transaction categorization rules (completely free - no API costs)
# Add keywords that commonly appear in transaction descriptions
categories:
  # Income sources
  income:
    keywords: ["salary", "payroll", "bonus", "interest", "dividend", "refund", "deposit", "direct deposit"]
    
  # Food & Dining
  groceries:
    keywords: ["grocery", "supermarket", "whole foods", "safeway", "trader joe", "kroger", "walmart", "costco", "market"]
  
  dining:
    keywords: ["restaurant", "cafe", "coffee", "starbucks", "mcdonald", "burger", "pizza", "delivery", "uber eats", "doordash", "grubhub"]
  
  # Transportation
  transportation:
    keywords: ["gas", "fuel", "shell", "exxon", "bp", "chevron", "uber", "lyft", "taxi", "parking", "metro", "transit", "bus"]
  
  # Bills & Utilities
  bills:
    keywords: ["electric", "electricity", "water", "gas bill", "internet", "comcast", "verizon", "at&t", "phone", "wireless", "cable"]
  
  housing:
    keywords: ["rent", "mortgage", "property", "insurance", "hoa", "maintenance"]
  
  # Shopping
  shopping:
    keywords: ["amazon", "target", "best buy", "walmart", "clothing", "department", "mall", "online"]
  
  # Entertainment
  entertainment:
    keywords: ["movie", "theater", "netflix", "spotify", "gaming", "concert", "ticket", "streaming"]
  
  # Healthcare
  healthcare:
    keywords: ["medical", "doctor", "pharmacy", "cvs", "walgreen", "hospital", "dental", "vision"]
  
  # Banking & Finance
  banking:
    keywords: ["atm", "fee", "bank", "transfer", "payment", "credit card"]
  
  # Catch-all for unmatched transactions
  other:
    keywords: []

# Dashboard configuration
dashboard:
  host: "127.0.0.1"
  port: 8050
  debug: false
  
# Processing settings  
processing:
  # Date formats to try when parsing transactions
  date_formats: 
    - "%m/%d/%Y"
    - "%m-%d-%Y"  
    - "%Y-%m-%d"
    - "%m/%d/%y"
    - "%m-%d-%y"
  
  # Currency symbols to handle
  currency_symbols: ["$", "USD"]
  
  # Skip transactions with these descriptions (e.g., internal transfers)
  skip_descriptions: ["TRANSFER", "PAYMENT THANK YOU"]

# Future ML settings (when you want to add machine learning)
ml:
  enabled: false
  model_path: "./models/categorizer.pkl"
  confidence_threshold: 0.8