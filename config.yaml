# Financial Tracker Configuration

# Data directories
data:
  raw_statements: "./data/raw"
  processed: "./data/processed" 
  categorized: "./data/categorized"

# Transaction categorization rules (completely free - no API costs)
# Add keywords that commonly appear in transaction descriptions
categories:
  # Income sources
  income:
    keywords: ["salary", "payroll", "bonus", "interest", "dividend", "refund", "deposit", "direct deposit", "employer_co", "income_source", "credit", "transfer", "internet transfer"]
    
  # Food & Dining (UK-focused)
  groceries:
    keywords: ["tesco", "sainsbury", "asda", "morrisons", "aldi", "lidl", "co-op", "waitrose", "iceland", "marks spencer", "m&s food", "grocery", "supermarket", "food"]
  
  dining:
    keywords: ["costa", "pret", "greggs", "cafe", "restaurant", "coffee", "mcdonald", "burger king", "kfc", "pizza", "nando", "wetherspoon", "pub", "deliveroo", "just eat", "uber eats", "takeaway", "dining"]
  
  # Transportation (UK-focused)
  transportation:
    keywords: ["shell", "bp", "esso", "petrol", "fuel", "tfl", "transport for london", "oyster", "uber", "taxi", "parking", "train", "rail", "bus", "underground", "tube", "national express"]
  
  # Bills & Utilities (UK-focused)
  utilities:
    keywords: ["british gas", "eon", "edf", "octopus energy", "bulb", "shell energy", "scottish power", "thames water", "severn trent", "anglian water", "electricity", "gas bill", "water"]
  
  bills:
    keywords: ["bt", "sky", "virgin media", "ee", "o2", "vodafone", "three", "phone", "mobile", "broadband", "internet", "tv licence", "council tax"]
  
  housing:
    keywords: ["rent", "mortgage", "property", "insurance", "service charge", "ground rent", "estate agent", "letting", "housing"]
  
  # Shopping (UK-focused)  
  shopping:
    keywords: ["amazon", "argos", "john lewis", "currys", "next", "h&m", "zara", "primark", "boots", "superdrug", "shopping", "online", "retail", "clothing", "department"]
  
  # Entertainment (UK-focused)
  entertainment:
    keywords: ["netflix", "spotify", "amazon prime", "disney", "bbc iplayer", "cinema", "odeon", "vue", "cineworld", "theater", "theatre", "music", "streaming", "gaming", "entertainment"]
  
  # Healthcare (UK-focused)
  healthcare:
    keywords: ["boots", "superdrug", "pharmacy", "nhs", "private healthcare", "bupa", "medical", "dental", "optician", "specsavers", "vision express", "hospital"]
  
  # Banking & Finance
  banking:
    keywords: ["atm", "fee", "bank", "transfer", "payment", "credit card"]
  
  # Catch-all for unmatched transactions
  other:
    keywords: []

# Dashboard configuration
dashboard:
  host: "127.0.0.1"
  port: 8050
  debug: false
  
# Processing settings  
processing:
  # Date formats to try when parsing transactions (UK-focused)
  date_formats: 
    - "%d/%m/%Y"    # 31/12/2025 (UK standard)
    - "%d-%m-%Y"    # 31-12-2025
    - "%d %b %Y"    # 31 Dec 2025 (HSBC format)
    - "%d %b %y"    # 31 Dec 25 (HSBC short format)
    - "%Y-%m-%d"    # 2025-12-31 (ISO format)
    - "%m/%d/%Y"    # 12/31/2025 (US format - fallback)
    - "%m-%d-%Y"    # 12-31-2025 (US format - fallback)
  
  # Currency symbols to handle (UK-focused)
  currency_symbols: ["£", "GBP", "$", "USD"]
  
  # Skip transactions with these descriptions (UK patterns)
  skip_descriptions: ["BALANCE BROUGHT FORWARD", "BALANCE CARRIED FORWARD", "TRANSFER", "PAYMENT THANK YOU", "STATEMENT"]

# ML categorization settings (hybrid system with rule-based fallback)
ml:
  enabled: true
  model_path: "./models/categorizer.pkl" 
  confidence_threshold: 0.75
  min_training_samples: 10  # Minimum samples per category for ML training