# Dashboard configuration
dashboard:
  host: "127.0.0.1"
  port: 8050
  debug: false
  
# Processing settings  
processing:
  # Date formats to try when parsing transactions (UK-focused)
  date_formats: 
    - "%d/%m/%Y"    # 31/12/2025 (UK standard)
    - "%d-%m-%Y"    # 31-12-2025
    - "%d %b %Y"    # 31 Dec 2025 (HSBC format)
    - "%d %b %y"    # 31 Dec 25 (HSBC short format)
    - "%Y-%m-%d"    # 2025-12-31 (ISO format)
    - "%m/%d/%Y"    # 12/31/2025 (US format - fallback)
    - "%m-%d-%Y"    # 12-31-2025 (US format - fallback)
  
  # Currency symbols to handle (UK-focused)
  currency_symbols: ["£", "GBP", "$", "USD"]
  
  # Skip transactions with these descriptions (UK patterns)
  skip_descriptions: ["BALANCE BROUGHT FORWARD", "BALANCE CARRIED FORWARD", "TRANSFER", "PAYMENT THANK YOU", "STATEMENT"]

# ML categorization settings (hybrid system with rule-based fallback)
ml:
  enabled: true
  model_path: "./data/models/transaction_categorizer.pkl" 
  confidence_threshold: 0.75
  min_training_samples: 10  # Minimum samples per category for ML training
  # Enhanced for hierarchical categorization
  predict_subcategories: true
  fallback_to_category: true  # If subcategory prediction fails, use category only